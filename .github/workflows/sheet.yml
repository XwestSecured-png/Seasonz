# Seasonz → Google Sheets (1.43.0).
# Manual run: builds every tab of the app's data. With a "cert" (a public
# certificate) the tabs are encrypted to that certificate and pushed to a
# short-lived branch, so only the holder of the matching private key can
# read them (the repo is public). With the Google secrets set
# (GOOGLE_SERVICE_ACCOUNT_JSON, SEASONZ_SHEET_ID) it also refreshes the Sheet;
# the regular sync job refreshes it automatically after each sync.
name: Seasonz sheet export

on:
  workflow_dispatch:
    inputs:
      cert:
        description: "Base64 public certificate to encrypt the export to (optional; blank = just refresh the Sheet and clean up)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # Remove the previous run's hand-off branch, if any.
      - name: Clean up old export branch
        run: git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete sheet-export-tmp || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build tabs (and refresh the Sheet if configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEASONZ_SHEET_ID: ${{ secrets.SEASONZ_SHEET_ID }}
          NODE_ENV: production
        run: npx tsx --tsconfig tsconfig.json scripts/sheet-export.ts --out=sheet.json --push
      - name: Encrypt the export
        if: ${{ inputs.cert != '' }}
        env:
          CERT_B64: ${{ inputs.cert }}
        run: |
          printf '%s' "$CERT_B64" | base64 -d > cert.pem
          openssl cms -encrypt -binary -aes256 -outform DER -in sheet.json -out sheet.json.enc cert.pem
          rm -f sheet.json
      # Hand the encrypted file over on a short-lived branch (it is deleted
      # right after it is read). Without the private key it is unreadable.
      - name: Publish encrypted export
        if: ${{ inputs.cert != '' }}
        run: |
          mkdir -p /tmp/out && mv sheet.json.enc /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b sheet-export-tmp
          git -c user.name=seasonz-bot -c user.email=bot@users.noreply.github.com add sheet.json.enc
          git -c user.name=seasonz-bot -c user.email=bot@users.noreply.github.com commit -qm "encrypted sheet export"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sheet-export-tmp
        env:
          GH_TOKEN: ${{ github.token }}
